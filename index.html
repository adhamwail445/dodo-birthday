<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Dalia! 🥳</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #e1bee7);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #333;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #d81b60;
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .card {
      position: relative;
      background: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 25px;
    }

    .card img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      display: block;
    }

    .message-box {
      padding: 20px;
      background: #fff;
    }

    .message-text {
      font-size: 1.2rem;
      color: #4a148c;
      font-weight: 600;
      line-height: 1.5;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    button {
      background: #d81b60;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s ease;
      flex: 1;
    }

    button:hover {
      background: #ad1457;
    }

    .counter {
      font-size: 0.9rem;
      color: #777;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="main-title">🎉 Hi Dodo! 🎉</h1>

    <div class="card">
      <img id="display-image" src="" alt="Birthday Photo">
      <div class="message-box">
        <p id="display-message" class="message-text"></p>
      </div>
    </div>

    <div class="controls">
      <button id="prev-btn">Previous ⬅️</button>
      <span id="counter" class="counter">1 / 20</span>
      <button id="next-btn">Next ➡️</button>
    </div>
  </div>

  <script>
    // أسماء الصور الحقيقية من المستودع الخاص بك على GitHub
    const photosWithMessages = [
      { img: "20241203_161402.jpg", text: "Happy Birthday to the most beautiful Dalia in the world 🥳❤️" },
      { img: "IMG-20240531-WA0000.jpg", text: "You are the most precious thing in my life ✨" },
      { img: "IMG-20240716-WA0010.jpg", text: "There is no one like you, and there never will be ❤️" },
      { img: "IMG-20240806-WA0000.jpg", text: "May your smile never fade away 🌸" },
      { img: "IMG-20240806-WA0002.jpg", text: "You bring so much light and joy into my world 💖" },
      { img: "IMG-20250213-WA0032.jpg", text: "Every single moment with you is truly special ✨" },
      { img: "IMG-20250519-WA0071.jpg", text: "Wishing you a lifetime of happiness and peace 🥰" },
      { img: "IMG-20260120-WA0044.jpg", text: "Cheers to 100 more years filled with joy and success 🎉" },
      { img: "IMG-20260222-WA0032.jpg", text: "Happy 21st Birthday to the prettiest girl 🎂" },
      { img: "IMG-20260618-WA0092.jpg", text: "You mean so much to me forever & always ❤️" },
      { img: "IMG-20260618-WA0093.jpg", text: "Always shining in your own unique way ✨" },
      { img: "IMG-20260618-WA0100.jpg", text: "Your smile brightens up the whole day ☀️" },
      { img: "IMG-20260619-WA0011.jpg", text: "Cool, stylish, and full of positive vibes 😎" },
      { img: "IMG-20260619-WA0012.jpg", text: "Every memory created with you is unforgettable ❤️" },
      { img: "IMG-20260619-WA0013.jpg", text: "Pure joy and beautiful moments everywhere 🌸" },
      { img: "IMG-20260619-WA0023.jpg", text: "Keep shining brighter every single year 🎉" },
      { img: "IMG-20260619-WA0030.jpg", text: "Wishing you peace, happiness, and love always 🥰" },
      { img: "IMG-20260619-WA0031.jpg", text: "Warmest wishes on your special day 💖" },
      { img: "Snapchat-1287102871.jpg", text: "Peace and endless happiness on your birthday ✌️🎂" },
      { img: "Snapchat-1519329329.jpg", text: "To many more amazing years and celebrations ahead 🎉" }
    ];

    let currentIndex = 0;

    const mainTitle = document.getElementById("main-title");
    const imgElement = document.getElementById("display-image");
    const msgElement = document.getElementById("display-message");
    const counterElement = document.getElementById("counter");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    function updateCard(index) {
      imgElement.src = photosWithMessages[index].img;
      msgElement.textContent = photosWithMessages[index].text;
      counterElement.textContent = `${index + 1} / ${photosWithMessages.length}`;

      if (index === 0) {
        mainTitle.textContent = "🎉 Hi Dodo! 🎉";
      } else {
        mainTitle.textContent = "🎉 Happy 21st Birthday Dalia! 🎉";
      }
    }

    prevBtn.addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + photosWithMessages.length) % photosWithMessages.length;
      updateCard(currentIndex);
    });

    nextBtn.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % photosWithMessages.length;
      updateCard(currentIndex);
    });

    updateCard(currentIndex);
  </script>
</body>
</html>
