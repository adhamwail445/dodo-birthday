<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dodo Birthday ❤️</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Welcome Screen -->

<section id="welcome" class="screen">

    <h1>Hi Dodo ❤️</h1>

    <p>Every memory has a story...</p>

</section>




<!-- Password Screen -->

<section id="lock" class="screen hidden">

    <div class="lock">

        <div class="lock-icon">
            🔐
        </div>


        <input 
        id="password"
        type="password"
        placeholder="Only Dodo knows the secret."
        >


        <button onclick="unlock()">
            Unlock
        </button>


    </div>

</section>




<!-- Gate Screen -->

<section id="gate" class="screen hidden">

    <div class="gate">

        <h1>
            Are you ready? ✨
        </h1>


        <button onclick="startJourney()">
            Enter the journey ❤️
        </button>


    </div>

</section>




<!-- Memories Screen -->

<section id="memories" class="screen hidden">

    <h1>
        Our Memories ❤️
    </h1>


    <div class="photo-card">

        <img src="images/photo1.jpg">


        <p>
        A beautiful memory that will always stay with me ❤️
        </p>


    </div>


</section>




<!-- Final Screen -->

<section id="final" class="screen hidden">


    <h1>
        Happy Birthday, Dodo ❤️
    </h1>


    <p>
        Made with love by Adham.
    </p>


</section>



<script src="script.js"></script>


</body>

</html>
