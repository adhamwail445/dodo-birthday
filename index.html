<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dodo ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Background -->
    <div id="background-effects"></div>

    <!-- Welcome -->
    <section id="welcome" class="screen active">

        <div class="welcome-box">

            <h1 id="typing-title">Hi Dodo ❤️</h1>

            <p id="typing-subtitle">
                Every memory has a story...
            </p>

        </div>

    </section>

    <!-- Lock Screen -->
    <section id="lock" class="screen">

        <div class="glass-card">

            <div class="lock-icon">🔐</div>

            <input
                id="password"
                type="password"
                placeholder="Only Dodo knows the secret."
                maxlength="6"
            >

            <button id="unlockBtn">
                Unlock ❤️
            </button>

        </div>

    </section>
    <!-- Gate -->

    <section id="gate" class="screen">

        <div class="glass-card">

            <h1>Are you ready? ✨</h1>

            <p>
                I made something special just for you...
            </p>

            <button id="startJourney">
                Begin the Journey ❤️
            </button>

        </div>

    </section>



    <!-- Journey -->

    <section id="journey" class="screen">

        <div id="memory-container">

        </div>

    </section>



    <!-- Ending -->

    <section id="ending" class="screen">

        <div class="glass-card">

            <h1>Happy Birthday Dodo ❤️</h1>

            <p>
                Made with all my love by Adham.
            </p>

        </div>

    </section>



    <script src="script.js"></script>

</body>
</html>
